<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Fireworks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #000;
            cursor: crosshair;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .credit {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #888;
            font-size: 14px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">Realistic Fireworks</div>
    <canvas id="canvas"></canvas>
    <div class="credit">Click anywhere to create fireworks</div>
    <div class="controls">Auto mode: Space to toggle | Auto: ON</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let autoMode = true;
        let lastAutoFireTime = 0;

        class Particle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.ay = 0.06; // gravity
            }

            update() {
                this.vx *= 0.98; // air resistance
                this.vy *= 0.98;
                this.vy += this.ay; // apply gravity

                this.x += this.vx;
                this.y += this.vy;

                this.life--;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function randColor() {
            const colors = [
                '#FF1461', '#18FF92', '#5A87FF', '#FBF38C',
                '#FF006E', '#FB5607', '#FFBE0B', '#8338EC',
                '#FF006E', '#FB5607', '#FFBE0B', '#FF006E'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function makeFullCircleFirework(fire) {
            const color = randColor();
            const velocity = Math.random() * 8 + 8;
            const fireNumber = 50;
            const max = fireNumber * 3;
            const range = 100;

            for (let i = 0; i < max; i++) {
                const rad = (i * Math.PI * 2) / max;
                const particle = new Particle(
                    fire.x,
                    fire.y,
                    Math.cos(rad) * velocity + (Math.random() - 0.5) * 0.5,
                    Math.sin(rad) * velocity + (Math.random() - 0.5) * 0.5,
                    color,
                    Math.random() + 1.5,
                    Math.round((Math.random() * range) / 2) + range / 1.5
                );
                particles.push(particle);
            }
        }

        function makeLaunchTrail(startX, startY, endX, endY) {
            const steps = 15;
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const x = startX + (endX - startX) * t;
                const y = startY + (endY - startY) * t;

                const particle = new Particle(
                    x,
                    y,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    '#FFD700',
                    Math.random() * 2 + 1,
                    Math.random() * 30 + 20
                );
                particles.push(particle);
            }
        }

        function createFirework(x, y) {
            // Launch trail
            makeLaunchTrail(x, y + 200, x, y);
            // Explosion
            makeFullCircleFirework({ x, y });
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);

                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Auto mode
            if (autoMode) {
                const now = Date.now();
                if (now - lastAutoFireTime > 800) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height * 0.6) + canvas.height * 0.2;
                    createFirework(x, y);
                    lastAutoFireTime = now;
                }
            }

            requestAnimationFrame(animate);
        }

        // Mouse click to create fireworks
        document.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });

        // Space to toggle auto mode
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                autoMode = !autoMode;
                document.querySelector('.controls').textContent = 
                    `Auto mode: Space to toggle | Auto: ${autoMode ? 'ON' : 'OFF'}`;
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
