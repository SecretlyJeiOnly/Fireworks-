<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fireworks</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.message {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.75);
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="message">✨</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

const fireworks = [];
const rockets = [];
const stars = [];

const fireNumber = 25;
const range = 100;


// -----------------------------
// SCREEN SIZE
// -----------------------------

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    createStars();
}

window.addEventListener("resize", resize);


// -----------------------------
// RANDOM COLOR
// -----------------------------

function randColor() {

    const colors = [
        "#ffffff",
        "#ffd166",
        "#ff4d6d",
        "#00e5ff",
        "#b967ff",
        "#7cff6b",
        "#ff9f1c"
    ];

    return colors[
        Math.floor(Math.random() * colors.length)
    ];
}


// -----------------------------
// STARS
// -----------------------------

function createStars() {

    stars.length = 0;

    const amount = Math.floor(
        (width * height) / 9000
    );

    for (let i = 0; i < amount; i++) {

        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5,
            alpha: Math.random()
        });

    }
}


function drawStars() {

    for (const star of stars) {

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,255,255,${star.alpha})`;

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// -----------------------------
// FIREWORK EXPLOSION
// -----------------------------

function makeFullCircleFirework(fire) {

    let color = randColor();

    let velocity =
        Math.random() * 8 + 8;

    let max =
        fireNumber * 3;

    for (let i = 0; i < max; i++) {

        let rad =
            (i * Math.PI * 2) / max;

        let firework = {

            x: fire.x,
            y: fire.y,

            size:
                Math.random() * 2 + 1.5,

            fill: color,

            vx:
                Math.cos(rad) * velocity +
                (Math.random() - 0.5) * 0.85,

            vy:
                Math.sin(rad) * velocity +
                (Math.random() - 0.5) * 0.5,

            ay: 0.06,

            alpha: 1,

            life:
                Math.round(
                    Math.random() * range / 2
                ) + range / 1.5
        };

        fireworks.push(firework);
    }
}


// -----------------------------
// ROCKET
// -----------------------------

function createRocket() {

    rockets.push({

        x:
            Math.random() * width,

        y:
            height + 10,

        targetY:
            height * 0.15 +
            Math.random() * height * 0.4,

        vy:
            -(8 + Math.random() * 3),

        trail: []

    });
}


// -----------------------------
// UPDATE ROCKETS
// -----------------------------

function updateRockets() {

    for (
        let i = rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket = rockets[i];

        rocket.trail.push({
            x: rocket.x,
            y: rocket.y
        });

        if (rocket.trail.length > 10) {
            rocket.trail.shift();
        }

        rocket.y += rocket.vy;

        rocket.vy += 0.035;


        // Rocket trail

        for (
            let j = 0;
            j < rocket.trail.length;
            j++
        ) {

            const point = rocket.trail[j];

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(255,255,255,${
                    j / rocket.trail.length
                })`;

            ctx.arc(
                point.x,
                point.y,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        // Explode

        if (
            rocket.y <= rocket.targetY ||
            rocket.vy >= 0
        ) {

            makeFullCircleFirework({
                x: rocket.x,
                y: rocket.y
            });

            rockets.splice(i, 1);
        }
    }
}


// -----------------------------
// UPDATE PARTICLES
// -----------------------------

function updateFireworks() {

    for (
        let i = fireworks.length - 1;
        i >= 0;
        i--
    ) {

        const particle = fireworks[i];

        particle.vy += particle.ay;

        particle.x += particle.vx;
        particle.y += particle.vy;

        particle.vx *= 0.985;
        particle.vy *= 0.985;

        particle.life--;

        particle.alpha =
            Math.max(
                0,
                particle.life / 100
            );


        // Glow

        ctx.beginPath();

        ctx.shadowBlur = 15;
        ctx.shadowColor = particle.fill;

        ctx.fillStyle =
            `rgba(255,255,255,${
                particle.alpha
            })`;

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;


        if (
            particle.life <= 0 ||
            particle.alpha <= 0
        ) {

            fireworks.splice(i, 1);
        }
    }
}


// -----------------------------
// AUTOMATIC FIREWORKS
// -----------------------------

let timer = 0;

function automaticFireworks() {

    timer++;

    if (timer > 70) {

        timer = 0;

        createRocket();
    }
}


// -----------------------------
// ANIMATION
// -----------------------------

function animate() {

    ctx.fillStyle =
        "rgba(2,3,10,0.20)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    drawStars();

    automaticFireworks();

    updateRockets();

    updateFireworks();

    requestAnimationFrame(animate);
}


// -----------------------------
// START
// -----------------------------

resize();

setTimeout(() => {
    createRocket();
}, 500);

setTimeout(() => {
    createRocket();
}, 1200);

setTimeout(() => {
    createRocket();
}, 1900);

animate();

</script>

</body>
</html>
